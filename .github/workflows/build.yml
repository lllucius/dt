name: Build DECtalk

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ubuntu:
    name: Ubuntu (latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Ubuntu Packages
        run: sudo apt-get update

      - name: Install dependencies
        run: sudo apt-get -y install build-essential libpulse-dev libgtk2.0-dev unzip autoconf automake

      - name: Create configure files
        working-directory: src
        run: |
          set -o pipefail
          mkdir -p ../baseline-runs/ci
          autoreconf -i 2>&1 | tee ../baseline-runs/ci/autoreconf.log

      - name: Configure
        working-directory: src
        run: |
          set -o pipefail
          ./configure 2>&1 | tee ../baseline-runs/ci/configure.log

      - name: Make DECtalk
        working-directory: src
        run: |
          set -o pipefail
          make 2>&1 | tee ../baseline-runs/ci/build.log

      - name: Verify baseline outputs
        run: |
          mkdir -p baseline-runs/ci/symbols baseline-runs/ci/dictionaries baseline-runs/ci/audio-us
          tools/baseline/capture_symbols.sh --out baseline-runs/ci/symbols
          tools/baseline/compare_symbols.sh \
            --expected tests/golden/symbols \
            --actual baseline-runs/ci/symbols \
            --out baseline-runs/ci/symbol-compare \
            > baseline-runs/ci/symbol-compare.txt
          tools/baseline/capture_dictionaries.sh --out baseline-runs/ci/dictionaries
          tools/baseline/compare_dictionaries.sh \
            --expected tests/golden/dictionaries \
            --actual baseline-runs/ci/dictionaries \
            --out baseline-runs/ci/dictionary-compare \
            > baseline-runs/ci/dictionary-compare.txt
          tools/baseline/capture_user_dictionaries.sh --out baseline-runs/ci/user-dictionaries
          tools/baseline/compare_dictionaries.sh \
            --expected tests/golden/dictionaries/user/expected \
            --actual baseline-runs/ci/user-dictionaries \
            --out baseline-runs/ci/user-dictionary-compare \
            > baseline-runs/ci/user-dictionary-compare.txt
          tools/baseline/capture_audio.sh --out baseline-runs/ci/audio-us
          tools/baseline/compare_audio.py --actual baseline-runs/ci/audio-us \
            --metrics-out baseline-runs/ci/audio-metrics.tsv \
            > baseline-runs/ci/audio-compare.log
          tools/baseline/check_public_headers.sh \
            --out baseline-runs/ci/public-headers \
            --expected tests/golden/public-headers
          tools/baseline/summarize_warnings.py \
            --log baseline-runs/ci/build.log \
            --out-dir baseline-runs/ci/warnings-default
          tools/baseline/check_warning_budgets.py \
            --warnings baseline-runs/ci/warnings-default/warnings.tsv \
            --budget tests/golden/warnings/default-cleaned.tsv \
            --out baseline-runs/ci/warning-budget.tsv

      - name: Capture baseline visibility
        if: always()
        run: |
          mkdir -p baseline-runs/ci/symbols
          if [ -f baseline-runs/ci/build.log ]; then
            grep -n 'warning:' baseline-runs/ci/build.log > baseline-runs/ci/warnings.log || true
            grep -c 'warning:' baseline-runs/ci/build.log > baseline-runs/ci/warning-count.txt || true
          fi
          if [ -d dist ]; then
            tools/baseline/capture_dist_manifest.sh --out baseline-runs/ci/dist-manifest.txt || true
          fi
          if [ -d dist/lib ]; then
            tools/baseline/capture_symbols.sh --out baseline-runs/ci/symbols || true
          fi
          if [ -d dist/dic ]; then
            tools/baseline/capture_dictionaries.sh --out baseline-runs/ci/dictionaries || true
          fi
          if [ -x dist/tools/udic_us ]; then
            tools/baseline/capture_user_dictionaries.sh --out baseline-runs/ci/user-dictionaries || true
          fi
          if [ -x dist/say ]; then
            tools/baseline/capture_audio.sh --out baseline-runs/ci/audio-us || true
            tools/baseline/compare_audio.py --actual baseline-runs/ci/audio-us \
              --metrics-out baseline-runs/ci/audio-metrics.tsv \
              > baseline-runs/ci/audio-compare.log 2>&1 || true
          fi
          tools/baseline/check_public_headers.sh \
            --out baseline-runs/ci/public-headers \
            --expected tests/golden/public-headers || true
          if [ -f baseline-runs/ci/build.log ]; then
            tools/baseline/summarize_warnings.py \
              --log baseline-runs/ci/build.log \
              --out-dir baseline-runs/ci/warnings-default || true
            if [ -f baseline-runs/ci/warnings-default/warnings.tsv ]; then
              tools/baseline/check_warning_budgets.py \
                --warnings baseline-runs/ci/warnings-default/warnings.tsv \
                --budget tests/golden/warnings/default-cleaned.tsv \
                --out baseline-runs/ci/warning-budget.tsv || true
            fi
          fi

      - name: Upload baseline visibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-latest-baseline-visibility
          path: baseline-runs/ci/

      - name: Create a `.tar.gz` of the dist/ folder.
        run: tar -cvzf dectalk.tar.gz -C dist/ .

      - name: Create artifacts (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-latest-zip
          path: dist/

      - name: Create artifacts (.tar.gz.zip)
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-latest-tar
          path: dectalk.tar.gz

  macosx:
    name: Mac OS X
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Mac OS X packages
        run: brew update

      - name: Install dependencies
        run: brew install autoconf automake libtool

      - name: Create configure files
        working-directory: src
        run: |
          set -o pipefail
          mkdir -p ../baseline-runs/ci
          autoreconf -i 2>&1 | tee ../baseline-runs/ci/autoreconf.log

      - name: Configure
        working-directory: src
        run: |
          set -o pipefail
          ./configure 2>&1 | tee ../baseline-runs/ci/configure.log

      - name: Make DECtalk
        working-directory: src
        run: |
          set -o pipefail
          make 2>&1 | tee ../baseline-runs/ci/build.log

      - name: Capture baseline visibility
        if: always()
        run: |
          if [ -f baseline-runs/ci/build.log ]; then
            grep -n 'warning:' baseline-runs/ci/build.log > baseline-runs/ci/warnings.log || true
            grep -c 'warning:' baseline-runs/ci/build.log > baseline-runs/ci/warning-count.txt || true
          fi
          if [ -d dist ]; then
            find dist -print | sort > baseline-runs/ci/dist-paths.txt
          fi

      - name: Upload baseline visibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-latest-baseline-visibility
          path: baseline-runs/ci/

      - name: Create a `.tar.gz` of the dist/ folder.
        run: tar -cvzf dectalk.tar.gz -C dist/ .

      - name: Create artifacts (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: macos-latest-zip
          path: dist/

      - name: Create artifacts (.tar.gz.zip)
        uses: actions/upload-artifact@v4
        with:
          name: macos-latest-tar
          path: dectalk.tar.gz

  vs6-server2022:
    name: Visual Studio 6
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make DECtalk
        shell: cmd
        run: |
          mkdir baseline-runs\ci
          call devops\vs6\dt_buildall.bat > baseline-runs\ci\build.log 2>&1
          set BUILD_EXIT=%ERRORLEVEL%
          type baseline-runs\ci\build.log
          exit /b %BUILD_EXIT%

      - name: Copy files to the "/dist" folder
        shell: cmd
        run: |
          call devops\vs6\dt_copyfiles.bat > baseline-runs\ci\copyfiles.log 2>&1
          set COPY_EXIT=%ERRORLEVEL%
          type baseline-runs\ci\copyfiles.log
          exit /b %COPY_EXIT%

      - name: Upload baseline visibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vs6-baseline-visibility
          path: baseline-runs/ci/

      - name: Create artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vs6
          path: dist/

  vs2022:
    name: Visual Studio 2022 (IA32 and AMD64)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1

      - name: Make DECtalk
        shell: cmd
        run: |
          mkdir baseline-runs\ci
          call devops\vs2022\dt_buildall.bat > baseline-runs\ci\build.log 2>&1
          set BUILD_EXIT=%ERRORLEVEL%
          type baseline-runs\ci\build.log
          exit /b %BUILD_EXIT%

      - name: Copy files to the "/dist" folder
        shell: cmd
        run: |
          call devops\vs2022\dt_copyfiles.bat > baseline-runs\ci\copyfiles.log 2>&1
          set COPY_EXIT=%ERRORLEVEL%
          type baseline-runs\ci\copyfiles.log
          exit /b %COPY_EXIT%

      - name: Upload baseline visibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vs2022-baseline-visibility
          path: baseline-runs/ci/

      - name: Create artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vs2022
          path: dist/
